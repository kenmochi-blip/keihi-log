  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f5f8fc; }
    .check-wrap { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
    .brand-bar { background: #fff; border-bottom: 1px solid #e9eef5; }
    .brand-bar .inner { max-width: 560px; margin: 0 auto; padding: 0.7rem 1rem; }
    .progress { height: 6px; background: #e3ecf7; }
    .progress-bar { background: #0d6efd; transition: width 0.3s; }
    .q-card {
      background: #fff; border: 1px solid #e3e8ef; border-radius: 18px;
      padding: 1.6rem 1.4rem; box-shadow: 0 4px 18px rgba(13,110,253,0.06);
    }
    .q-num { color: #0d6efd; font-weight: 700; font-size: 0.82rem; letter-spacing: 0.06em; }
    .q-title { font-weight: 700; font-size: 1.15rem; line-height: 1.6; margin: 0.35rem 0 1.1rem; }
    .opt-btn {
      display: flex; align-items: center; gap: 0.7rem; width: 100%;
      background: #fff; border: 1.5px solid #d7e2f0; border-radius: 12px;
      padding: 0.85rem 1rem; margin-bottom: 0.65rem; text-align: left;
      font-size: 0.98rem; font-weight: 600; color: #2c3e50;
      transition: border-color 0.12s, background 0.12s;
    }
    .opt-btn i { color: #0d6efd; font-size: 1.1rem; flex-shrink: 0; }
    @media (hover: hover) {
      .opt-btn:hover { border-color: #0d6efd; background: #f4f9ff; }
    }
    .opt-btn:active { border-color: #0d6efd; background: #eaf3ff; }
    .opt-sub { display: block; font-size: 0.78rem; font-weight: 400; color: #8593a4; margin-top: 0.15rem; }
    .btn-back { font-size: 0.85rem; color: #8593a4; text-decoration: none; }
    /* 結果カード */
    .result-badge {
      display: inline-block; padding: 0.35rem 1rem; border-radius: 50px;
      font-size: 0.82rem; font-weight: 700; margin-bottom: 0.8rem;
    }
    .result-title { font-weight: 800; font-size: 1.45rem; line-height: 1.5; }
    .result-note {
      background: #f4f9ff; border-left: 3px solid #0d6efd; border-radius: 0 10px 10px 0;
      padding: 0.8rem 1rem; font-size: 0.9rem; line-height: 1.9; margin-top: 1rem;
    }
    .result-caveat {
      background: #fff8ec; border-left: 3px solid #f0a832; border-radius: 0 10px 10px 0;
      padding: 0.8rem 1rem; font-size: 0.88rem; line-height: 1.9; margin-top: 0.8rem; color: #6b5417;
    }
    .price-line { font-size: 1.05rem; }
    .price-line strong { font-size: 1.6rem; color: #0d6efd; }
  </style>
</head>
<body>

<div class="brand-bar">
  <div class="inner d-flex align-items-center justify-content-between">
    <a href="/" class="text-decoration-none fw-bold d-flex align-items-center gap-2" style="color:#0d6efd;font-size:1.05rem;">
      <img src="/favicon.svg" width="24" height="24" alt="">経費ログ
    </a>
    <a href="/" class="btn-back">トップへ戻る</a>
  </div>
</div>

<div class="check-wrap">
  <div class="text-center mb-3 mt-2">
    <h1 class="fw-bold" style="font-size:1.3rem;">経費ログ診断</h1>
    <p class="text-muted mb-2" style="font-size:0.88rem;">
      5つの質問で、あなたに合うかどうかがわかります。<br>
      合わない場合は正直に「不要かも」とお伝えします。
    </p>
  </div>

  <div class="progress mb-3 rounded-pill">
    <div id="bar" class="progress-bar" style="width:0%"></div>
  </div>

  <div id="stage"></div>

  <p class="text-center text-muted mt-4" style="font-size:0.76rem;">
    回答内容が送信・保存されることはありません（この画面の中だけで判定します）
  </p>
</div>

<script>
(function () {
  'use strict';

  /* 質問定義。value はそのまま answers[key] に入る */
  const QUESTIONS = [
    {
      key: 'receipts',
      title: '毎月あつかう領収書・レシートは、どのくらいありますか？',
      opts: [
        { v: 'few',  icon: 'bi-receipt',       label: 'ほとんどない（月5枚以下）' },
        { v: 'some', icon: 'bi-receipt-cutoff', label: 'そこそこある（月6〜30枚）' },
        { v: 'many', icon: 'bi-files',          label: 'たくさんある（月31枚以上）' },
      ],
    },
    {
      key: 'members',
      title: '経費の立替（自腹で払って後で精算）が発生するのは？',
      opts: [
        { v: 'solo', icon: 'bi-person',       label: '自分だけ', sub: 'ひとり社長・個人事業主など' },
        { v: 'team', icon: 'bi-people',       label: '2人以上いる', sub: '社員・スタッフも立て替える' },
        { v: 'none', icon: 'bi-credit-card',  label: '立替はほぼない', sub: 'ほぼすべて法人カード・会社払い' },
      ],
    },
    {
      key: 'accounting',
      title: '経理・会計処理は、いまどうしていますか？',
      opts: [
        { v: 'outsource', icon: 'bi-briefcase',        label: '税理士・会計事務所に任せている', sub: '領収書を渡して記帳はお任せ' },
        { v: 'self',      icon: 'bi-laptop',           label: '自分（自社）で会計ソフトに入力している' },
        { v: 'piled',     icon: 'bi-inboxes',          label: '正直、レシートが溜まりがち…' },
      ],
    },
    {
      key: 'size',
      title: '従業員数は？（役員・パート含むおおよそで）',
      opts: [
        { v: 's1',   icon: 'bi-person-badge', label: '自分ひとり' },
        { v: 's10',  icon: 'bi-people',       label: '2〜10名くらい' },
        { v: 's30',  icon: 'bi-building',     label: '11〜30名くらい' },
        { v: 's31',  icon: 'bi-buildings',    label: '31名以上' },
      ],
    },
    {
      key: 'revenue',
      title: '年間の売上規模は？',
      opts: [
        { v: 'r1', icon: 'bi-graph-up',       label: '〜1億円くらい' },
        { v: 'r5', icon: 'bi-graph-up-arrow', label: '1〜5億円くらい' },
        { v: 'r5plus', icon: 'bi-bank',       label: '5億円超' },
      ],
    },
  ];

  const answers = {};
  let step = 0;
  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  function renderQuestion() {
    const q = QUESTIONS[step];
    bar.style.width = `${(step / QUESTIONS.length) * 100}%`;
    stage.innerHTML = `
      <div class="q-card">
        <div class="q-num">Q${step + 1} / ${QUESTIONS.length}</div>
        <div class="q-title">${esc(q.title)}</div>
        ${q.opts.map((o, i) => `
          <button class="opt-btn" data-i="${i}">
            <i class="bi ${o.icon}"></i>
            <span>${esc(o.label)}${o.sub ? `<span class="opt-sub">${esc(o.sub)}</span>` : ''}</span>
          </button>`).join('')}
        ${step > 0 ? '<div class="text-center mt-2"><a href="#" class="btn-back" id="btnBack"><i class="bi bi-arrow-left me-1"></i>ひとつ前に戻る</a></div>' : ''}
      </div>`;
    stage.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        answers[q.key] = q.opts[Number(btn.dataset.i)].v;
        if (step === 0 && typeof gtag === 'function') gtag('event', 'diagnosis_start');
        step += 1;
        if (step < QUESTIONS.length) renderQuestion();
        else renderResult();
        window.scrollTo({ top: 0 });
      });
    });
    document.getElementById('btnBack')?.addEventListener('click', (e) => {
      e.preventDefault();
      step -= 1;
      renderQuestion();
    });
  }

  /* 判定ロジック
     - 領収書がほぼ無い かつ 立替もほぼ無い → 不要かも（正直判定）
     - 立替が自分だけ → ソロプラン
     - 立替が2人以上 → チームプラン
     - 立替ほぼ無し（会社払い中心）でも件数があるなら記録・証票管理用途でプラン提案
     - 31名以上／売上5億超 は注意書きを添える */
  function judge() {
    const a = answers;
    if (a.receipts === 'few' && a.members === 'none') return 'no-need';
    if (a.members === 'solo') return 'solo';
    if (a.members === 'team') return 'team';
    /* members === 'none'（会社払い中心）: 従業員が複数なら記録者も複数になりがち */
    return (a.size === 's1') ? 'solo' : 'team';
  }

  function renderResult() {
    bar.style.width = '100%';
    const verdict = judge();
    const a = answers;

    /* 経理スタイル別の一言 */
    const acctNote = {
      outsource: '税理士・会計事務所には、<strong>CSVやスプレッドシートの共有で渡すだけ</strong>になります。領収書の原本を封筒で送る作業から卒業できます。',
      self: '会計ソフトには<strong>CSVで取り込めます</strong>（勘定科目・税区分つき）。手入力の二度打ちがなくなります。',
      piled: '経費ログは<strong>「撮って送るだけ」</strong>なので、その場で記録が終わり、レシートが溜まりません。溜まりがちな方にこそ向いています。',
    }[a.accounting] || '';

    const caveats = [];
    if (a.size === 's31') {
      caveats.push('従業員31名以上とのこと。経費ログは1チーム定額でそのまま使えますが、<strong>多段階承認や事前申請などの複雑なワークフローが必須</strong>の場合は、大手の経費精算SaaSとの比較もおすすめします（経費ログは意図的にそれらを搭載していません）。');
    }
    if (a.revenue === 'r5plus') {
      caveats.push('売上5億円超の場合、消費税の仕入税額控除で個別対応（いわゆる95%ルールの適用外）が必要になることがあります。経費ログは税区分つきでデータを出せますが、<strong>運用は顧問税理士に一度ご相談ください</strong>。');
    }

    let html = '';
    if (verdict === 'no-need') {
      html = `
        <div class="q-card text-center">
          <span class="result-badge" style="background:#eef2f7;color:#5a6b7f;">診断結果</span>
          <div class="result-title mb-2">いまは、まだ必要ないかもしれません</div>
          <p class="text-muted" style="font-size:0.92rem;line-height:1.9;">
            領収書が月5枚以下で立替もほぼ無いなら、<br class="d-none d-sm-block">
            現状のやり方で十分回っている可能性が高いです。<br>
            無理に導入をおすすめしません。
          </p>
          <div class="result-note text-start">
            件数が増えてきたら、また思い出してください。<br>
            2週間の無料トライアル（カード登録不要）はいつでも試せます。
          </div>
          <a href="/app?demo" class="btn btn-outline-primary rounded-pill px-4 mt-3">
            <i class="bi bi-play-circle me-1"></i>いちおうデモをさわってみる
          </a>
        </div>`;
    } else {
      const isSolo = verdict === 'solo';
      html = `
        <div class="q-card">
          <div class="text-center">
            <span class="result-badge" style="background:#e7f1ff;color:#0d6efd;">診断結果</span>
            <div class="result-title mb-1">${isSolo ? 'ソロプランが合いそうです' : 'チームプランが合いそうです'}</div>
            <p class="price-line mt-2 mb-1"><strong>${isSolo ? '330' : '825'}</strong> 円 / 月（税込）${isSolo ? '' : '・メンバー何人でも定額'}</p>
            <p class="text-muted mb-0" style="font-size:0.85rem;">
              ${isSolo
                ? 'AI領収書解析・集計・CSV・電帳法対応まで、ひとりで使う機能はすべて入っています。'
                : 'メンバーはURLを開いてGoogleでログインするだけ。承認・精算の管理、LINEでの申請にも対応します。'}
            </p>
          </div>
          ${acctNote ? `<div class="result-note">${acctNote}</div>` : ''}
          ${caveats.map(c => `<div class="result-caveat"><i class="bi bi-info-circle me-1"></i>${c}</div>`).join('')}
          <div class="d-grid gap-2 mt-4">
            <a href="https://buy.stripe.com/5kQ28r1Ps7ut2kv4io9oc08" class="btn btn-primary rounded-pill py-2">
              2週間無料で使ってみる（カード登録不要）
            </a>
            <a href="/app?demo" class="btn btn-outline-primary rounded-pill py-2">
              <i class="bi bi-play-circle me-1"></i>先にデモをさわってみる
            </a>
          </div>
          <p class="text-center text-muted mt-3 mb-0" style="font-size:0.76rem;">
            トライアル後に自動課金されることはありません。<br>プランは有料切替のときに選べば大丈夫です。
          </p>
        </div>`;
    }

    html += `
      <div class="text-center mt-3">
        <a href="#" class="btn-back" id="btnRetry"><i class="bi bi-arrow-counterclockwise me-1"></i>最初からやり直す</a>
      </div>`;

    stage.innerHTML = html;
    if (typeof gtag === 'function') gtag('event', 'diagnosis_result', { result: verdict });
    document.getElementById('btnRetry')?.addEventListener('click', (e) => {
      e.preventDefault();
      step = 0;
      for (const k of Object.keys(answers)) delete answers[k];
      renderQuestion();
      window.scrollTo({ top: 0 });
    });
  }

  renderQuestion();
})();
</script>
</body>
</html>
