  <text x="340" y="180" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥385</text>
  <line x1="20" y1="190" x2="340" y2="190" stroke="#f0f0f0" stroke-width="0.5"/>
  <text x="30" y="208" font-family="sans-serif" font-size="12" fill="#333">付箋 ふせん</text>
  <text x="340" y="208" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥495</text>
  <line x1="20" y1="218" x2="340" y2="218" stroke="#f0f0f0" stroke-width="0.5"/>
  <text x="30" y="236" font-family="sans-serif" font-size="12" fill="#333">緑茶 525ml ×2　<tspan fill="#c0392b">軽</tspan></text>
  <text x="340" y="236" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥300</text>
  <line x1="20" y1="246" x2="340" y2="246" stroke="#f0f0f0" stroke-width="0.5"/>
  <text x="30" y="264" font-family="sans-serif" font-size="12" fill="#333">会議用 茶菓子 詰合せ　<tspan fill="#c0392b">軽</tspan></text>
  <text x="340" y="264" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥780</text>
  <line x1="20" y1="274" x2="340" y2="274" stroke="#ee7d23" stroke-width="1.5"/>
  <!-- 税率別小計 -->
