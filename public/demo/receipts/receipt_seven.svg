  <text x="130" y="418" font-family="sans-serif" font-size="11" fill="#555">お支払：現金</text>
  <text x="130" y="440" font-family="sans-serif" font-size="10" fill="#888"><tspan fill="#c0392b">軽</tspan> …軽減税率（8%）対象</text>
