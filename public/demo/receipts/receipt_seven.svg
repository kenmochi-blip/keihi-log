<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520">
  <rect width="360" height="520" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <!-- ヘッダー（コンビニ風・オレンジ） -->
  <rect width="360" height="60" fill="#ee7d23"/>
  <text x="180" y="28" font-family="sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">セブン-イレブン</text>
