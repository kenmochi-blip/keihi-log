  <text x="34" y="351" font-family="sans-serif" font-size="12" fill="#d35400">合　計（内消費税 ¥160）</text>
  <text x="340" y="353" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ee7d23" text-anchor="end">¥1,960</text>
