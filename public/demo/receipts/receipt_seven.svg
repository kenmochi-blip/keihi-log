  <text x="340" y="294" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥880</text>
  <text x="30" y="314" font-family="sans-serif" font-size="11" fill="#555">8%対象 <tspan fill="#c0392b">軽</tspan>（内消費税 ¥80）</text>
  <text x="340" y="314" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥1,080</text>
  <!-- 合計 -->
