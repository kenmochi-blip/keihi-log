  <rect y="448" width="360" height="32" fill="#232f3e"/>
  <text x="180" y="462" font-family="sans-serif" font-size="10" fill="#d5dbdb" text-anchor="middle">〒141-0021 東京都品川区上大崎3-1-1</text>
  <text x="180" y="475" font-family="sans-serif" font-size="10" fill="#d5dbdb" text-anchor="middle">aws.amazon.com</text>
