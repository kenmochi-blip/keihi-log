  <line x1="20" y1="162" x2="340" y2="162" stroke="#ddd" stroke-width="0.5"/>
  <text x="30" y="180" font-family="sans-serif" font-size="12" fill="#333">Amazon EC2</text>
  <text x="340" y="180" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥21,300</text>
  <line x1="20" y1="190" x2="340" y2="190" stroke="#f0f0f0" stroke-width="0.5"/>
  <text x="30" y="208" font-family="sans-serif" font-size="12" fill="#333">Amazon S3</text>
  <text x="340" y="208" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥6,850</text>
  <line x1="20" y1="218" x2="340" y2="218" stroke="#f0f0f0" stroke-width="0.5"/>
  <text x="30" y="236" font-family="sans-serif" font-size="12" fill="#333">Amazon RDS</text>
  <text x="340" y="236" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥6,850</text>
  <line x1="20" y1="246" x2="340" y2="246" stroke="#ff9900" stroke-width="1.5"/>
  <!-- 小計・消費税・合計 -->
  <text x="200" y="266" font-family="sans-serif" font-size="12" fill="#555">小計</text>
  <text x="340" y="266" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥35,000</text>
  <text x="200" y="286" font-family="sans-serif" font-size="12" fill="#555">消費税（10%）</text>
  <text x="340" y="286" font-family="sans-serif" font-size="12" fill="#333" text-anchor="end">¥3,500</text>
  <rect x="20" y="296" width="320" height="38" fill="#fef5e7" rx="3"/>
  <text x="200" y="311" font-family="sans-serif" font-size="12" fill="#b9770e">ご請求額</text>
  <text x="340" y="321" font-family="sans-serif" font-size="22" font-weight="bold" fill="#232f3e" text-anchor="end">¥38,500</text>
