  <line x1="20" y1="355" x2="340" y2="355" stroke="#ddd" stroke-width="0.5"/>
  <text x="30" y="378" font-family="sans-serif" font-size="11" fill="#555">請求日：2026年5月10日</text>
  <text x="30" y="396" font-family="sans-serif" font-size="11" fill="#555">対象期間：5月分ご利用料金</text>
  <text x="30" y="414" font-family="sans-serif" font-size="11" fill="#555">お支払：クレジットカード（法人カード）</text>
