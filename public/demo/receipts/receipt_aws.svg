  <line x1="20" y1="100" x2="340" y2="100" stroke="#ff9900" stroke-width="2"/>
  <!-- 宛先 -->
  <text x="30" y="125" font-family="sans-serif" font-size="13" fill="#333">デモCo.　御中</text>
